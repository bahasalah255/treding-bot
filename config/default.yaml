project:
  name: xauusd-backtest
  mode: backtest_only
  timezone: UTC

market:
  symbol: XAUUSD
  main_timeframe: M5
  confirmation_timeframe: M15

capital:
  initial_mad: 1000.0
  # Fraction of balance risked per trade (0.005 is 0.5%).
  risk_per_trade: 0.005
  max_simultaneous_positions: 1
  max_daily_loss: 0.02
  max_total_drawdown: 0.05

strategy:
  fast_ema: 9
  slow_ema: 21
  trend_ema: 50
  atr_period: 14
  stop_distance_atr: 1.5
  reward_risk: 2.0

costs:
  # Price increment of one "point" for this broker's XAUUSD contract. Record
  # the real value in data/metadata/ before modelling spread or slippage; it is
  # never guessed. Leave null while spread/slippage points are zero.
  price_per_point: null
  spread_points: 0
  commission_per_lot_mad: 0.0
  slippage_points: 0

data:
  required_columns:
    - timestamp
    - open
    - high
    - low
    - close
    - tick_volume
    - spread
